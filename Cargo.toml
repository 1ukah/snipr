[workspace]
resolver = "2"
members = ["crates/snipr-browser", "crates/snipr-llm", "crates/snipr-core", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
snipr-browser = { path = "crates/snipr-browser" }
snipr-llm = { path = "crates/snipr-llm" }
snipr-core = { path = "crates/snipr-core" }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "charset"] }
# Cliente HTTP com fingerprint TLS/HTTP2 de Chrome (lojas que recusam clientes comuns).
# Rust puro: não precisa de CMake, NASM nem LLVM. Não está no crates.io.
impit = { git = "https://github.com/apify/impit.git", rev = "c68f6fdc75c2f258f5859da8b84e949005c8bbd8" }
scraper = "0.29"
ego-tree = "0.11"
regex = "1"
tokio-tungstenite = "0.24"
axum = "0.8"
rand = "0.8"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
url = "2"
urlencoding = "2"
which = "6"
dotenvy = "0.15"
parking_lot = "0.12"

# Forks do impit que permitem imitar o handshake do Chrome (mesmas revisões do impit).
[patch.crates-io]
h2 = { git = "https://github.com/apify/h2", rev = "7f393a728a8db07cabb1b78d2094772b33943b9a" }
rustls = { git = "https://github.com/apify/rustls", rev = "5ce04170965aff5da23154e79f5ee25c37134da1" }
tower-http = { git = "https://github.com/apify/tower-http", rev = "4d96dbd81f86559c38cf76b8ce671089544a26e3" }
hyper-util = { git = "https://github.com/apify/hyper-util", rev = "401e6fb99bb6bd4956a0fafca39f4b7b37be8a0a" }
reqwest = { git = "https://github.com/seanmonstar/reqwest", rev = "2230ed3945fb2908692b88dad1dcd06db9fb2ca6" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Dependências compiladas otimizadas mesmo em debug: o app de dev fica leve e rápido.
[profile.dev.package."*"]
opt-level = 2
