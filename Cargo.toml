[workspace]
resolver = "2"
members = ["crates/snipr-browser", "crates/snipr-llm", "crates/snipr-core", "apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
snipr-browser = { path = "crates/snipr-browser" }
snipr-llm = { path = "crates/snipr-llm" }
snipr-core = { path = "crates/snipr-core" }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.24"
axum = "0.8"
rand = "0.8"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
url = "2"
urlencoding = "2"
which = "6"
dotenvy = "0.15"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Dependências compiladas otimizadas mesmo em debug: o app de dev fica leve e rápido.
[profile.dev.package."*"]
opt-level = 2
