<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snipr</title>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></symbol>
  <symbol id="i-user" viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.8"/><path d="M2.5 14c.8-2.6 3-4 5.5-4s4.7 1.4 5.5 4"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></symbol>
  <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1" fill="currentColor"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></symbol>
  <symbol id="i-out" viewBox="0 0 16 16"><path d="M6 3.5H3.5v9h9V10M9 2.5h4.5V7M13.5 2.5 7.5 8.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 16 16"><path d="M1.5 8.5h3l1.8-4.5 3 8 1.9-3.5h3.3"/></symbol>
  <symbol id="i-filter" viewBox="0 0 16 16"><path d="M2 4h12M4.5 8h7M7 12h2"/></symbol>
  <symbol id="i-cond" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></symbol>
  <symbol id="i-store" viewBox="0 0 16 16"><path d="M2.5 6.5 3.5 2.5h9l1 4M2.5 6.5h11M3.5 6.5V13.5h9V6.5M6.5 13.5v-4h3v4"/></symbol>
  <symbol id="i-price" viewBox="0 0 16 16"><path d="M8.5 2H14v5.5L7.5 14 2 8.5z"/><circle cx="11" cy="5" r="1" fill="currentColor"/></symbol>
  <symbol id="i-system" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="8.5" rx="1"/><path d="M5.5 14h5M8 11.5V14"/></symbol>
  <symbol id="i-moon" viewBox="0 0 16 16"><path d="M13 9.8A5.5 5.5 0 0 1 6.2 3a5.5 5.5 0 1 0 6.8 6.8z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></symbol>
  <symbol id="i-palette" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 0 0 12z" fill="currentColor"/></symbol>
  <symbol id="i-spark" viewBox="0 0 16 16"><path d="M8 1.5 9.4 6.6 14.5 8 9.4 9.4 8 14.5 6.6 9.4 1.5 8 6.6 6.6z"/></symbol>
  <symbol id="i-bot" viewBox="0 0 16 16"><rect x="3" y="5" width="10" height="8" rx="2"/><path d="M8 2.5V5M6 9h.01M10 9h.01"/></symbol>
  <symbol id="i-one" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2" fill="currentColor"/></symbol>
  <symbol id="i-many" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1.6" fill="currentColor"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/><circle cx="12.5" cy="8" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-globe" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c1.8 1.7 2.6 3.7 2.6 6S9.8 12.3 8 14C6.2 12.3 5.4 10.3 5.4 8S6.2 3.7 8 2z"/></symbol>
  <symbol id="i-hidden" viewBox="0 0 16 16"><path d="M2 8s2.2-4 6-4 6 4 6 4-2.2 4-6 4-6-4-6-4z"/><path d="M2.5 13.5l11-11"/></symbol>
  <symbol id="i-headless" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1" stroke-dasharray="1.6 1.6"/></symbol>
  <symbol id="i-eye" viewBox="0 0 16 16"><path d="M2 8s2.2-4 6-4 6 4 6 4-2.2 4-6 4-6-4-6-4z"/><circle cx="8" cy="8" r="1.8"/></symbol>
  <symbol id="i-image-off" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2 11l3.5-3.5L8 10M2 2l12 12"/></symbol>
  <symbol id="i-chip" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1"/><path d="M6 1.5V4M10 1.5V4M6 12v2.5M10 12v2.5M1.5 6H4M1.5 10H4M12 6h2.5M12 10h2.5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></symbol>
  <symbol id="i-key" viewBox="0 0 16 16"><circle cx="5" cy="10.5" r="2.8"/><path d="M7 8.5 13.5 2M11 4.5l1.8 1.8M9.4 6.1l1.4 1.4"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></symbol>
  <symbol id="i-skip" viewBox="0 0 16 16"><path d="M3 3.5l6 4.5-6 4.5zM12.5 3.5v9"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="mark" viewBox="0 0 64 64"><g fill="currentColor"><circle cx="4.0" cy="30.0" r="3"/><circle cx="5.75" cy="26.0" r="1"/><circle cx="7.5" cy="22.0" r="1"/><circle cx="9.25" cy="18.0" r="1"/><circle cx="11.0" cy="14.0" r="3"/><circle cx="12.75" cy="18.0" r="1"/><circle cx="14.5" cy="22.0" r="1"/><circle cx="16.25" cy="26.0" r="1"/><circle cx="18.0" cy="30.0" r="3"/><circle cx="21.0" cy="26.0" r="1"/><circle cx="24.0" cy="22.0" r="3"/><circle cx="26.0" cy="25.67" r="1"/><circle cx="28.0" cy="29.33" r="1"/><circle cx="30.0" cy="33.0" r="1"/><circle cx="43.5" cy="33.5" r="1"/><circle cx="46.0" cy="30.0" r="3"/><circle cx="48.33" cy="32.67" r="1"/><circle cx="50.67" cy="35.33" r="1"/><circle cx="53.0" cy="38.0" r="3"/><circle cx="54.17" cy="34.33" r="1"/><circle cx="55.33" cy="30.67" r="1"/><circle cx="56.5" cy="27.0" r="1"/><circle cx="57.67" cy="23.33" r="1"/><circle cx="58.83" cy="19.67" r="1"/><circle cx="60" cy="16" r="3"/><circle cx="36" cy="44" r="2.4"/></g><circle cx="36" cy="44" r="7" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M41.87 49.87L48.02 56.02" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></symbol>
  <symbol id="i-infinity" viewBox="0 0 16 16"><path d="M8 8C6.8 6.3 5.6 5.2 4.2 5.2 2.6 5.2 1.5 6.4 1.5 8s1.1 2.8 2.7 2.8C5.6 10.8 6.8 9.7 8 8s2.4-2.8 3.8-2.8c1.6 0 2.7 1.2 2.7 2.8s-1.1 2.8-2.7 2.8C10.4 10.8 9.2 9.7 8 8z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.5 4.5h11M6 4.5V2.5h4v2M4 4.5l.7 9h6.6l.7-9"/></symbol>
  <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2 4.5V12.5h12V5.5H7.5L6 3.5H2z"/></symbol>
  <symbol id="i-tag" viewBox="0 0 16 16"><path d="M2.5 2.5h5l6 6-5 5-6-6z"/><circle cx="5.5" cy="5.5" r="1" fill="currentColor"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 3v3.5H9.5M3 13V9.5h3.5"/><path d="M12.6 6.5A5 5 0 0 0 3.6 5M3.4 9.5a5 5 0 0 0 9 1.5"/></symbol>
</svg>

<div class="app" id="app">
  <header class="top"><div class="wrap">
    <div class="brand">
      <button class="tb only-narrow" id="o-filters"><svg class="i"><use href="#i-filter"/></svg><span data-t="filters"></span></button>
      <svg viewBox="0 0 64 64" aria-label="Snipr"><use href="#mark"/></svg>
    </div>
    <form class="bar" id="form" autocomplete="off">
      <input id="q" spellcheck="false" data-t-placeholder="searchPlaceholder" data-t-aria="search">
      <button type="submit" class="go" id="go"><svg class="i"><use href="#i-search"/></svg></button>
      <span class="busy"></span>
    </form>
    <div class="acts">
      <button class="tb" id="o-accounts"><svg class="i"><use href="#i-user"/></svg><span class="lbl" data-t="accounts"></span></button>
      <button class="tb" id="o-settings"><svg class="i"><use href="#i-gear"/></svg><span class="lbl" data-t="settings"></span></button>
    </div>
  </div></header>

  <div class="mid">
  <div class="scroller"><div class="wrap body">
    <aside class="side" id="side">
      <div class="fs">
        <div class="fl"><svg class="i"><use href="#i-cond"/></svg><span data-t="condition"></span></div>
        <div id="f-cond"></div>
      </div>
      <div class="fs">
        <div class="fl"><svg class="i"><use href="#i-globe"/></svg><span data-t="origin"></span></div>
        <div id="f-origin"></div>
      </div>
      <div class="fs">
        <div class="fl"><svg class="i"><use href="#i-store"/></svg><span data-t="stores"></span><button class="fl-add" id="o-stores" data-t-title="manageStores" data-t-aria="manageStores"><svg class="i"><use href="#i-plus"/></svg></button></div>
        <div class="sel" id="stores"></div>
      </div>
      <div class="fs">
        <div class="fl"><svg class="i"><use href="#i-price"/></svg><span data-t="price"></span></div>
        <div class="hist" id="hist"></div>
        <div class="range"><input type="range" id="r-lo" data-t-aria="priceMin"><input type="range" id="r-hi" data-t-aria="priceMax"></div>
        <div class="pr">
          <label>R$<input id="p-lo" inputmode="numeric" data-t-aria="priceMin"></label>
          <span>–</span>
          <label>R$<input id="p-hi" inputmode="numeric" data-t-aria="priceMax"><svg class="i inf-ic" aria-hidden="true"><use href="#i-infinity"/></svg></label>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="plan" id="plan"></div>
      <div class="human" id="human" hidden></div>
      <div class="more" id="more" hidden></div>
      <div class="rh" id="rh" hidden>
        <span id="count"></span>
        <label class="rfind"><svg class="i"><use href="#i-search"/></svg><input id="r-filter" type="text" spellcheck="false" data-t-placeholder="filterResults" data-t-aria="filterResults"></label>
        <span class="sp"></span>
        <button class="tg" id="t-progress" role="switch" aria-checked="false"><span class="sw"></span><svg class="i"><use href="#i-pulse"/></svg><span data-t="progress"></span></button>
      </div>
      <div id="cols"></div>
      <ol class="list" id="list"></ol>
      <div class="empty" id="empty">
        <p data-t="emptyHelp"></p>
        <p><code data-t="emptyExample"></code></p>
      </div>
    </main>
  </div></div>
  <aside class="agents" id="agents" hidden></aside>
  </div>

  <footer class="foot wrap" id="foot" hidden></footer>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="sheet" id="settings" hidden>
    <div class="hd"><h2 data-t="settings"></h2><button class="ib" data-close data-t-title="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="grp">
      <div class="lab"><svg class="i"><use href="#i-palette"/></svg><span data-t="theme"></span></div>
      <div class="seg" id="theme"></div>
    </div>
    <div class="grp">
      <div class="lab"><svg class="i"><use href="#i-spark"/></svg><span data-t="ai"></span></div>
      <div class="seg" id="auth"></div>
      <div class="auth" id="auth-login"></div>
      <div class="auth" id="auth-key" hidden>
        <div class="sel" id="key-prov"></div>
        <div class="field" id="key-endpoint" hidden><span class="pre" data-t="endpoint"></span><input id="endpoint" placeholder="https://…/v1" spellcheck="false" data-t-aria="endpoint"></div>
        <div class="field" id="key-secret"></div>
      </div>
      <div class="auth" id="auth-oauth" hidden>
        <div class="field static"><span class="pre" data-t="provider"></span><span>Anthropic</span></div>
        <div class="field" id="oauth-secret"></div>
      </div>
      <p class="note" id="auth-note" hidden><svg class="i"><use href="#i-lock"/></svg><span data-t="secretNote"></span></p>
      <div class="sel model" id="model"></div>
      <p class="why sub" data-t="whyModel"></p>
      <div class="sel model" id="fast-model"></div>
      <p class="why sub" data-t="whyFastModel"></p>
      <div class="sel" id="effort"></div>
      <button class="tg" id="t-footer" role="switch"><span class="sw"></span><svg class="i"><use href="#i-pulse"/></svg><span data-t="statusBar"></span></button>
    </div>
    <div class="grp">
      <div class="lab"><svg class="i"><use href="#i-tag"/></svg><span data-t="resultsGroup"></span></div>
      <button class="tg" id="t-offers" role="switch"><span class="sw"></span><svg class="i"><use href="#i-price"/></svg><span data-t="offerDetails"></span></button>
      <p class="why" data-t="whyOffers"></p>
      <button class="tg" id="t-hist-manual" role="switch"><span class="sw"></span><svg class="i"><use href="#i-search"/></svg><span data-t="historyManual"></span></button>
      <button class="tg" id="t-hist-auto" role="switch"><span class="sw"></span><svg class="i"><use href="#i-clock"/></svg><span data-t="historyAuto"></span></button>
      <p class="why" data-t="whyHistory"></p>
      <div><button class="btn" id="open-data" type="button"><svg class="i"><use href="#i-folder"/></svg><span data-t="openFolder"></span></button></div>
    </div>
    <div class="grp">
      <div class="lab"><svg class="i"><use href="#i-bot"/></svg><span data-t="agents"></span></div>
      <p class="why" data-t="whyAgent"></p>
      <div class="kv"><span data-t="maxSteps"></span><label class="field"><input id="max-steps" inputmode="numeric" data-t-aria="maxSteps"></label></div>
    </div>
    <div class="grp">
      <div class="lab"><svg class="i"><use href="#i-globe"/></svg><span data-t="browser"></span></div>
      <div class="pick">
        <div class="sel" id="browser-pick"></div>
        <button class="btn" id="browser-test" type="button"><svg class="i"><use href="#i-check"/></svg><span data-t="testBrowser"></span></button>
      </div>
      <p class="note err" id="browser-warn" hidden></p>
      <div class="seg" id="bmode"></div>
      <p class="why" id="why-b"></p>
      <div class="kv"><span data-t="parallel"></span><label class="field"><input id="max-parallel" inputmode="numeric" data-t-aria="parallel"></label></div>
      <button class="tg" id="t-media" role="switch"><span class="sw"></span><svg class="i"><use href="#i-image-off"/></svg><span data-t="blockMedia"></span></button>
      <button class="tg" id="t-memory" role="switch"><span class="sw"></span><svg class="i"><use href="#i-chip"/></svg><span data-t="lowMemory"></span></button>
      <div class="kv"><span data-t="idleClose"></span><label class="field"><input id="idle" inputmode="numeric" data-t-aria="idleClose"><span class="pre">s</span></label></div>
      <details>
        <summary><span data-t="advanced"></span><svg class="i"><use href="#i-down"/></svg></summary>
        <div class="grp">
          <div class="field"><span class="pre" data-t="otherPath"></span><input id="chrome-path" spellcheck="false" data-t-placeholder="autoDetect" data-t-aria="chromePath"></div>
          <div class="field"><span class="pre" data-t="cliPath"></span><input id="cli-path" spellcheck="false" data-t-placeholder="autoDetect" data-t-aria="cliPath"></div>
        </div>
      </details>
    </div>
  </aside>

  <aside class="sheet" id="accounts" hidden>
    <div class="hd"><h2 data-t="accounts"></h2><button class="ib" data-close data-t-title="close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="grp">
      <p class="why" data-t="accountsHelp"></p>
      <div class="human" id="login-bar" hidden></div>
      <div id="site-rows"></div>
    </div>
  </aside>

  <section class="modal" id="stores-modal" hidden role="dialog" aria-modal="true" aria-labelledby="sm-title">
    <div class="m-hd">
      <h2 id="sm-title" data-t="stores"></h2>
      <label class="m-find"><svg class="i"><use href="#i-search"/></svg><input id="sm-q" type="text" spellcheck="false" data-t-placeholder="findStore" data-t-aria="findStore"></label>
      <button class="btn" id="sm-recheck" data-t-title="recheckLoginTitle"><svg class="i"><use href="#i-refresh"/></svg><span data-t="recheckLogin"></span></button>
      <button class="ib" data-close data-t-title="close"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="m-body">
      <section class="m-sec">
        <div class="m-sec-hd"><div class="lab"><svg class="i"><use href="#i-check"/></svg><span data-t="added"></span><span class="cnt" id="sm-n-added"></span></div></div>
        <div class="strip two" id="sm-added"></div>
      </section>
      <section class="m-sec">
        <div class="m-sec-hd"><div class="lab"><svg class="i"><use href="#i-spark"/></svg><span data-t="suggestions"></span><span class="cnt" id="sm-n-sugg"></span></div></div>
        <div class="strip two" id="sm-sugg"></div>
      </section>
      <section class="m-sec">
        <div class="m-sec-hd">
          <div class="lab"><svg class="i"><use href="#i-globe"/></svg><span data-t="manual"></span><span class="cnt" id="sm-n-man"></span></div>
          <form class="m-url" id="sm-url" autocomplete="off">
            <div class="field"><input id="sm-url-in" type="text" inputmode="url" placeholder="https://www.loja.com.br" spellcheck="false" data-t-aria="storeUrl"></div>
            <button class="btn pri" type="submit"><svg class="i"><use href="#i-plus"/></svg><span data-t="add"></span></button>
          </form>
        </div>
        <p class="note err" id="sm-url-msg" hidden></p>
        <div class="strip" id="sm-man"></div>
      </section>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
